name = "aura-dashboard-edge"
main = "website/cloudflare-worker.js"
compatibility_date = "2024-04-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./website/public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/socket.io/*"]

[vars]
# Required: upstream origin that runs your backend server (e.g. Render / VPS URL).
# Example: "https://aura-dashboard-web.onrender.com"
BACKEND_ORIGIN = ""
NODE_ENV = "production"
DASHBOARD_STRICT_STARTUP = "true"
