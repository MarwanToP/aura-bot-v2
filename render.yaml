# Aura Bot v2.0 — Render Unified Infrastructure
services:
  - type: web
    name: aura-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    
    # Critical for Render Free tier stability
    healthCheckPath: /api/health
    
    envVars:
      - key: NODE_ENV
        value: production

      # ── Core Identity ─────────────────────────────────────────
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

      # ── Database & Cache ──────────────────────────────────────
      # Note: Neon (Postgres) and Upstash (Redis) are recommended for Free Tier
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: "true"

      # ── AI Intelligence ───────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_ENABLED
        value: "true"
      - key: AI_CHAT_MODEL
        value: gemini-1.5-flash

      # ── Dashboard & Security ──────────────────────────────────
      - key: PORT # Render injects this, used by server.js
        value: "3000"
      - key: DASHBOARD_ENABLED
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # ── Scaling & Logs ────────────────────────────────────────
      - key: SHARD_COUNT
        value: "1"
      - key: LOG_LEVEL
        value: info
