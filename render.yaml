# Aura Bot v2.0 — Render Unified Infrastructure
services:
  # ── Discord Bot Core ─────────────────────────────────────
  - type: worker
    name: aura-bot-core
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    branch: main
    autoDeploy: true
    envVars:
      - key: MODE
        value: BOT
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # ── Intelligence Dashboard ──────────────────────────────
  - type: web
    name: aura-bot-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: MODE
        value: DASHBOARD
      - key: DASHBOARD_URL
        value: "https://aura-dashboard-1czd.onrender.com"

      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SHARD_COUNT
        value: "1"
      - key: LOG_LEVEL
        value: info
