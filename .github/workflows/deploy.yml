name: 🚀 Deploy to Railway / Render

on:
  push:
    branches: [main]
  workflow_dispatch:       # Allow manual deploys from GitHub Actions tab

jobs:
  # ── 1. Lint & Basic Check ──────────────────────────────────────
  validate:
    name: ✅ Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax (node --check)
        run: |
          find src -name "*.js" | xargs -I{} node --input-type=module --check < {} 2>/dev/null || true

  # ── 2. Build & Push Docker Image to GHCR (used by Railway/Render) ─
  docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-bot-v2:latest
            ghcr.io/${{ github.repository_owner }}/aura-bot-v2:${{ github.sha }}

  # ── 3. Trigger Railway Redeploy ────────────────────────────────
  deploy-railway:
    name: 🚂 Trigger Railway Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: vars.DEPLOY_TARGET == 'railway' || vars.DEPLOY_TARGET == ''
    steps:
      - name: Trigger Railway deploy webhook
        if: secrets.RAILWAY_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' || echo "Railway webhook not configured — deploy via git push"

  # ── 4. Trigger Render Redeploy ─────────────────────────────────
  deploy-render:
    name: 🎨 Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: vars.DEPLOY_TARGET == 'render'
    steps:
      - name: Trigger Render deploy hook
        if: secrets.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}" || echo "Render hook not configured"
