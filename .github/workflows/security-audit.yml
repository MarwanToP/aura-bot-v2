name: Automated Security Audit & Vulnerability Scanning

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday midnight
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  security-scan:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit Dependencies
        run: npm audit --audit-level=high || true

      - name: Git Secrets Verification
        run: |
          echo "Scanning for accidental secret commits..."
          ! grep -rE "DISCORD_TOKEN=[a-zA-Z0-9_-]{24,}" . --exclude-dir=node_modules --exclude-dir=.git | grep -v "your_discord_bot_token_here" || exit 1
